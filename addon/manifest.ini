name = AbsoluteSite
summary = "AbsoluteSite"
description = """Manage bookmarks, capture URLs instantly, track history, and perform quick web searches directly from NVDA. This fully accessible tool organizes your favorite websites into custom categories, assigns preferred browsers, and maximizes windows automatically for seamless browsing efficiency.
Hot Keys:
ALT+Backspace
Single Tap : open Absolute Site Manager
Double Tap : add New Site
Triple Tap : All More Visited
ALT+Windows+Backspace : Search Dialog"""
