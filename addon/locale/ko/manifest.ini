summary = "AbsoluteSite"
description = """NVDA에서 직접 북마크를 관리하고, URL을 즉시 캡처하며, 기록을 추적하고, 빠른 웹 검색을 수행합니다. 이 완전한 접근성을 갖춘 도구는 즐겨 찾는 웹사이트를 사용자 지정 카테고리로 정리하고, 선호하는 브라우저를 지정하며, 원활한 브라우징 효율성을 위해 창을 자동으로 최대화합니다.

단축키:
ALT+Backspace
한 번 탭: 절대 사이트 관리자 열기
두 번 탭: 새 사이트 추가
세 번 탭: 가장 많이 방문한 모든 사이트
ALT+Windows+Backspace: 검색 대화상자"""