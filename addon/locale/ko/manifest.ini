summary = "AbsoluteSite"
description = """북마크 관리, URL 즉시 캡처, 방문 기록 추적 및 NVDA에서 직접 빠른 웹 검색을 수행합니다. 완전히 접근 가능한 이 도구는 즐겨찾는 웹사이트를 사용자 지정 범주로 정리하고, 선호하는 브라우저를 지정하며, 원활한 탐색 효율성을 위해 창을 자동으로 최대화합니다.
단축키:
ALT+Backspace
한 번 누름 : Absolute Site Manager 열기
두 번 누름 : 새 사이트 추가
세 번 누름 : 자주 방문한 모든 사이트
ALT+Windows+Backspace : 검색 대화 상자"""