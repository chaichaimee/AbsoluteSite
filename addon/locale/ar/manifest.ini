summary = "الموقع المطلق"
description = """إدارة العلامات المرجعية، والتقاط عناوين الروابط فوراً، وتتبع السجل، وإجراء عمليات بحث سريع على الويب مباشرة من NVDA. تنظم هذه الأداة التي يمكن الوصول إليها بالكامل مواقع الويب المفضلة لديك في فئات مخصصة، وتحدد المتصفحات المفضلة، وتكبر النوافذ تلقائياً لتحقيق كفاءة تصفح سلسة.

مفاتيح الاختصار:
ALT+Backspace
نقرة واحدة: فتح مدير الموقع المطلق
نقرة مزدوجة: إضافة موقع جديد
ثلاث نقرات: الأكثر زيارة
ALT+Windows+Backspace: حوار البحث"""