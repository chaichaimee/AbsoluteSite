summary = "AbsoluteSite"
description = """إدارة العلامات المرجعية، والتقاط روابط URL فورًا، وتتبع السجل، وإجراء بحث سريع على الويب مباشرةً من NVDA. تُنظّم هذه الأداة المتوافقة تمامًا مع إمكانية الوصول موقعك المفضلة في فئات مخصصة، وتحدد المتصفحات المفضلة، وتكبر النوافذ تلقائيًا لزيادة كفاءة التصفح.
مفاتيح الاختصار:
ALT+Backspace
ضغط مرة واحدة : فتح Absolute Site Manager
ضغط مرتين : إضافة موقع جديد
ضغط ثلاث مرات : جميع المواقع الأكثر زيارة
ALT+Windows+Backspace : مربع حوار البحث"""