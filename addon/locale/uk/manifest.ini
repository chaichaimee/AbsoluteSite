description = """Керуйте закладками, миттєво зберігайте URL-адреси, відстежуйте історію та виконуйте швидкий пошук в інтернеті безпосередньо з NVDA. Цей повністю доступний інструмент впорядковує ваші улюблені вебсайти за спеціальними категоріями, призначає бажані браузери та автоматично розгортає вікна для максимальної ефективності перегляду.

Гарячі клавіші:
ALT+Backspace
Одинарний тап: відкрити диспетчер Absolute Site
Подвійний тап: додати новий сайт
Потрійний тап: найчастіше відвідувані
ALT+Windows+Backspace: діалог пошуку"""