description = """Управляйте закладками, миттєво захоплюйте URL-адреси, відстежуйте історію та виконуйте швидкий пошук у веб безпосередньо з NVDA. Цей повністю доступний інструмент організовує ваші улюблені веб-сайти за настроюваними категоріями, призначає бажані браузери та автоматично розгортає вікна для максимальної ефективності перегляду.
Гарячі клавіші:
ALT+Backspace
Одиночне натискання : відкрити Absolute Site Manager
Подвійне натискання : додати новий сайт
Потрійне натискання : усі найчастіше відвідувані
ALT+Windows+Backspace : діалогове вікно пошуку"""