summary = "AbsoluteSite"
description = """จัดการบุ๊กมาร์ก บันทึก URL ได้ทันที ติดตามประวัติการเข้าชม และค้นหาเว็บได้อย่างรวดเร็วโดยตรงจาก NVDA เครื่องมือที่รองรับการเข้าถึงอย่างสมบูรณ์นี้จะจัดระเบียบเว็บไซต์โปรดของคุณลงในหมวดหมู่ที่กำหนดเอง กำหนดเบราว์เซอร์ที่ต้องการ และขยายหน้าต่างให้ใหญ่ที่สุดโดยอัตโนมัติเพื่อประสิทธิภาพการท่องเว็บที่ราบรื่น
คีย์ลัด:
ALT+Backspace
กดครั้งเดียว : เปิด Absolute Site Manager
กดสองครั้ง : เพิ่มเว็บไซต์ใหม่
กดสามครั้ง : เว็บไซต์ที่มีการเข้าชมมากที่สุดทั้งหมด
ALT+Windows+Backspace : ไดอะล็อกการค้นหา"""