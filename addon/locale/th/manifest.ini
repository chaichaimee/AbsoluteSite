summary = "เว็บไซต์สัมบูรณ์"
description = """จัดการบุคมาร์ค บันทึก URL ทันที ติดตามประวัติ และค้นหาเว็บอย่างรวดเร็วได้โดยตรงจาก NVDA เครื่องมือที่เข้าถึงได้ทั้งหมดนี้จะจัดระเบียบเว็บไซต์โปรดของคุณลงในหมวดหมู่ที่กำหนดเอง กำหนดเบราว์เซอร์ที่ต้องการ และขยายหน้าต่างให้ใหญ่สุดโดยอัตโนมัติเพื่อให้การท่องเว็บมีประสิทธิภาพอย่างไร้รอยต่อ

ปุ่มลัด:
ALT+Backspace
แตะครั้งเดียว: เปิดตัวจัดการเว็บไซต์สัมบูรณ์
แตะสองครั้ง: เพิ่มเว็บไซต์ใหม่
แตะสามครั้ง: เว็บไซต์ที่เยี่ยมชมมากที่สุดทั้งหมด
ALT+Windows+Backspace: กล่องโต้ตอบการค้นหา"""