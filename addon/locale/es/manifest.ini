summary = "AbsoluteSite"
description = """Administra marcadores, captura URL al instante, realiza un seguimiento del historial y efectúa búsquedas web rápidas directamente desde NVDA. Esta herramienta totalmente accesible organiza tus sitios web favoritos en categorías personalizadas, asigna navegadores preferidos y maximiza las ventanas automáticamente para una navegación fluida y eficiente.
Teclas de acceso rápido:
ALT+Retroceso
Un toque : abrir Absolute Site Manager
Doble toque : añadir nuevo sitio
Triple toque : más visitados
ALT+Windows+Retroceso : diálogo de búsqueda"""