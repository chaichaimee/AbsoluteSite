summary = "Sitio absoluto"
description = """Administra marcadores, captura URL al instante, realiza un seguimiento del historial y realiza búsquedas web rápidas directamente desde NVDA. Esta herramienta totalmente accesible organiza tus sitios web favoritos en categorías personalizadas, asigna los navegadores preferidos y maximiza las ventanas automáticamente para una navegación eficiente y fluida.

Teclas de método abreviado:
ALT+Retroceso
Un toque: abrir el administrador de sitios absolutos
Doble toque: añadir nuevo sitio
Triple toque: todos los más visitados
ALT+Windows+Retroceso: Diálogo de búsqueda"""