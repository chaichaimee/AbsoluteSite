summary = "Site absolu"
description = """Gérez vos favoris, capturez des URL instantanément, suivez l'historique et effectuez des recherches web rapides directement depuis NVDA. Cet outil entièrement accessible organise vos sites web préférés dans des catégories personnalisées, attribue les navigateurs privilégiés et maximise automatiquement les fenêtres pour une efficacité de navigation fluide.

Raccourcis clavier :
ALT+Retour arrière
Un simple appui : ouvrir le gestionnaire de sites absolus
Un double appui : ajouter un nouveau site
Un triple appui : tous les plus visités
ALT+Windows+Retour arrière : boîte de dialogue de recherche"""