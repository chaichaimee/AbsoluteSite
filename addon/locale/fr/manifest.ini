summary = "AbsoluteSite"
description = """Gérez les marque-pages, capturez les URL instantanément, suivez l'historique et effectuez des recherches web rapides directement depuis NVDA. Cet outil entièrement accessible organise vos sites web préférés en catégories personnalisées, attribue des navigateurs préférés et agrandit automatiquement les fenêtres pour une navigation fluide et efficace.
Raccourcis clavier :
ALT+Retour arrière
Pression simple : ouvrir Absolute Site Manager
Double pression : ajouter un nouveau site
Triple pression : tous les sites les plus visités
ALT+Windows+Retour arrière : boîte de dialogue de recherche"""