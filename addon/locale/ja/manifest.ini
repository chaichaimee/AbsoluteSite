summary = "AbsoluteSite"
description = """ブックマークの管理、URLの instant 取得、履歴の追跡、NVDAからのクイック Web 検索を directly に実行します。このアクセシビリティに完全対応したツールは、お気に入りの Web サイトをカスタムカテゴリに整理し、優先ブラウザを割り当て、ウィンドウを自動的に最大化して、スムーズで効率的なブラウジングを実現します。
ショートカットキー:
ALT+Backspace
1回押す : Absolute Site Manager を開く
2回押す : 新しいサイトを追加
3回押す : すべてのよく閲覧するサイト
ALT+Windows+Backspace : 検索ダイアログ"""