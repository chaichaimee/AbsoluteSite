summary = "AbsoluteSite"
description = """NVDAから直接、ブックマークの管理、URLの即座のキャプチャ、履歴の追跡、および迅速なウェブ検索を実行します。この完全にアクセシブルなツールは、お気に入りのウェブサイトをカスタムカテゴリに整理し、好みのブラウザを割り当て、ウィンドウを自動的に最大化して、シームレスなブラウジング効率を実現します。

ホットキー:
ALT+バックスペース
シングルタップ: Absoluteサイトマネージャーを開く
ダブルタップ: 新しいサイトを追加
トリプルタップ: 最もアクセスしたサイト
ALT+Windows+バックスペース: 検索ダイアログ"""