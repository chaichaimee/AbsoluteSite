summary = "AbsoluteSite"
description = """Lesezeichen verwalten, URLs sofort erfassen, den Verlauf verfolgen und schnelle Websuchen direkt aus NVDA heraus durchführen. Dieses barrierefreie Tool organisiert Ihre bevorzugten Websites in benutzerdefinierten Kategorien, weist bevorzugte Browser zu und maximiert Fenster automatisch für ein nahtloses Surferlebnis.
Tastenkombinationen:
ALT+Rücktaste
Einmal drücken : Absolute Site Manager öffnen
Zweimal drücken : Neue Website hinzufügen
Dreimal drücken : Alle meistbesuchten Seiten
ALT+Windows+Rücktaste : Suchdialog"""