summary = "AbsoluteSite"
description = """Verwalten Sie Lesezeichen, erfassen Sie URLs sofort, verfolgen Sie den Verlauf und führen Sie schnelle Websuchen direkt aus NVDA heraus durch. Dieses vollständig barrierefreie Werkzeug organisiert Ihre Lieblingswebseiten in benutzerdefinierten Kategorien, weist bevorzugte Browser zu und maximiert Fenster automatisch für eine nahtlose Browsing-Effizienz.

Kurzbefehle:
ALT+Rücktaste
Einfach-Tippen: Absolute Site Manager öffnen
Doppelt-Tippen: Neue Website hinzufügen
Dreifach-Tippen: Alle meistbesuchten
ALT+Windows+Rücktaste: Suchdialog"""