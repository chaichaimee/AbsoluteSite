description = """Kelola markah, tangkap URL secara instan, lacak riwayat, dan lakukan pencarian web cepat langsung dari NVDA. Alat yang sepenuhnya aksesibel ini mengorganisasi situs web favorit Anda ke dalam kategori kustom, menentukan peramban pilihan, dan memaksimalkan jendela secara otomatis untuk efisiensi penelusuran yang mulus.
Tombol Pintas:
ALT+Backspace
Tekan Sekali : buka Absolute Site Manager
Tekan Dua Kali : tambah Situs Baru
Tekan Tiga Kali : Semua yang Sering Dikunjungi
ALT+Windows+Backspace : Dialog Pencarian"""