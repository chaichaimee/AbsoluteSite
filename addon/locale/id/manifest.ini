summary = "SitusAbsolut"
description = """Kelola penanda buku, tangkap URL secara instan, lacak riwayat, dan lakukan pencarian web cepat langsung dari NVDA. Alat yang sepenuhnya dapat diakses ini mengorganisasi situs web favorit Anda ke dalam kategori kustom, menetapkan peramban pilihan, dan memaksimalkan jendela secara otomatis untuk efisiensi penelusuran yang mulus.

Tombol Pintas:
ALT+Backspace
Ketukan Tunggal: buka Pengelola Situs Absolut
Ketukan Ganda: tambah Situs Baru
Ketukan Tiga Kali: Semua yang Sering Dikunjungi
ALT+Windows+Backspace: Dialog Pencarian"""