summary = "एब्सोल्यूट साइट"
description = """एनवीडीए से सीधे बुकमार्क प्रबंधित करें, यूआरएल तुरंत कैप्चर करें, इतिहास ट्रैक करें और त्वरित वेब खोज करें। यह पूरी तरह से सुलभ टूल आपकी पसंदीदा वेबसाइटों को कस्टम श्रेणियों में व्यवस्थित करता है, पसंदीदा ब्राउज़र असाइन करता है, और सहज ब्राउज़िंग दक्षता के लिए विंडो को स्वचालित रूप से अधिकतम करता है।

हॉटकीज़:
एएलटी+बैकस्पेस
सिंगल टैप: एब्सोल्यूट साइट मैनेजर खोलें
डबल टैप: नई साइट जोड़ें
ट्रिपल टैप: सभी अधिक देखी गई साइटें
एएलटी+विंडोज़+बैकस्पेस: खोज संवाद"""