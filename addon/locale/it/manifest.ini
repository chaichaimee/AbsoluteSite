summary = "AbsoluteSite"
description = """Yönet abonesi, URL'leri anında yakala, geçmişi takip et ve doğrudan NVDA'dan hızlı web aramaları yap. Bu tamamen erişilebilir araç, favori web sitelerinizi özel kategorilerde düzenler, tercih edilen tarayıcarları atar ve sorunsuz bir tarama verimliliği için pencereleri otomatik olarak maksimize eder.

Kısayol Tuşları:
ALT+Geri Tuşu
Tek Dokunuş : Mutlak Site Yöneticisini aç
Çift Dokunuş : Yeni Site ekle
Üçlü Dokunuş : En Çok Ziyaret Edilenler
ALT+Windows+Geri Tuşu : Arama İletişim Kutusu"""