summary = "AbsoluteSite"
description = """Gestisci i segnalibri, acquisisci URL all'istante, traccia la cronologia ed effettua ricerche web rapide direttamente da NVDA. Questo strumento completamente accessibile organizza i tuoi siti web preferiti in categorie personalizzate, assegna i browser preferiti e massimizza automaticamente le finestre per un'esperienza di navigazione fluida ed efficiente.
Tasti di scelta rapida:
ALT+Backspace
Pressione singola : apri Absolute Site Manager
Doppia pressione : aggiungi nuovo sito
Tripla pressione : tutti i più visitati
ALT+Windows+Backspace : finestra di dialogo di ricerca"""